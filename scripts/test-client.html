<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GNSS Server — Monitor</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        min-height: 100vh;
        padding: 1.25rem;
      }
      h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .05em; color: #94a3b8; margin-bottom: 1rem; }

      /* ── top bar ── */
      .topbar {
        display: flex; align-items: center; gap: .75rem;
        margin-bottom: 1.25rem; flex-wrap: wrap;
      }
      .topbar input {
        background: #1e2433; border: 1px solid #2d3748; color: #e2e8f0;
        border-radius: .375rem; padding: .375rem .75rem; font-size: .875rem;
        width: 22rem;
      }
      button {
        background: #3b82f6; color: #fff; border: none; border-radius: .375rem;
        padding: .375rem .875rem; font-size: .875rem; cursor: pointer;
      }
      button:hover { background: #2563eb; }
      button.secondary { background: #374151; }
      button.secondary:hover { background: #4b5563; }
      #dot {
        width: .625rem; height: .625rem; border-radius: 50%;
        background: #374151; flex-shrink: 0;
      }
      #dot.ok { background: #22c55e; }
      #dot.err { background: #ef4444; }
      #status-text { font-size: .8rem; color: #64748b; }

      /* ── health bar ── */
      #health-bar {
        display: flex; gap: 1.5rem; align-items: center;
        background: #1e2433; border: 1px solid #2d3748; border-radius: .5rem;
        padding: .5rem 1rem; margin-bottom: 1.25rem; font-size: .8rem; color: #94a3b8;
        flex-wrap: wrap;
      }
      #health-bar span { white-space: nowrap; }
      #health-bar b { color: #e2e8f0; }

      /* ── antenna grid ── */
      #antenna-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
        gap: .75rem;
        margin-bottom: 1.25rem;
      }
      .ant-card {
        background: #1e2433; border: 1px solid #2d3748; border-radius: .5rem;
        padding: .75rem 1rem; cursor: pointer; transition: border-color .15s;
        position: relative;
      }
      .ant-card:hover { border-color: #3b82f6; }
      .ant-card.active { border-color: #3b82f6; background: #1e2d4a; }
      .ant-card.stale { border-color: #b45309; }
      .ant-card.inactive {
        border-color: #2d3748;
        background: #161a24;
        opacity: 0.55;
        filter: grayscale(0.85);
      }
      .ant-card.inactive .ant-status { background: #1f1f1f !important; color: #6b7280 !important; }
      .ant-card.inactive.active { opacity: 0.75; }
      .ant-name { font-weight: 600; font-size: .9rem; margin-bottom: .25rem; }
      .ant-id { font-size: .7rem; color: #64748b; margin-bottom: .5rem; }
      .ant-status {
        display: inline-block; font-size: .65rem; font-weight: 700;
        padding: .15rem .45rem; border-radius: .25rem; margin-bottom: .5rem;
        letter-spacing: .04em;
      }
      .s-RTK_FIXED  { background: #14532d; color: #4ade80; }
      .s-RTK_FLOAT  { background: #1c3a5e; color: #60a5fa; }
      .s-DGPS       { background: #1e3a1e; color: #86efac; }
      .s-GPS        { background: #2d2a12; color: #fde047; }
      .s-ESTIMATED  { background: #2d1f12; color: #fb923c; }
      .s-NONE,.s-unknown { background: #1f1f1f; color: #6b7280; }
      .ant-row { display: flex; justify-content: space-between; font-size: .75rem; color: #94a3b8; margin-top: .2rem; }
      .ant-row b { color: #e2e8f0; }
      .ant-age { position: absolute; top: .5rem; right: .75rem; font-size: .65rem; color: #64748b; }
      .ant-age.stale { color: #f59e0b; }

      /* ── detail pane ── */
      #detail {
        background: #1e2433; border: 1px solid #2d3748; border-radius: .5rem;
        padding: 1rem 1.25rem; margin-bottom: 1.25rem;
        display: none;
      }
      #detail.visible { display: block; }
      #detail h2 { font-size: .9rem; font-weight: 600; color: #94a3b8; margin-bottom: .75rem; }
      .detail-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
        gap: .75rem;
      }
      .detail-box {
        background: #0f1117; border: 1px solid #2d3748; border-radius: .375rem;
        padding: .5rem .75rem;
      }
      .detail-box .lbl { font-size: .65rem; color: #64748b; text-transform: uppercase; letter-spacing: .06em; margin-bottom: .25rem; }
      .detail-box .val { font-size: .875rem; color: #e2e8f0; font-weight: 500; word-break: break-all; }
      .detail-box .val.mono { font-family: ui-monospace, monospace; font-size: .8rem; }
      .detail-box .sub { font-size: .7rem; color: #64748b; margin-top: .15rem; }

      /* ── rest panel ── */
      #rest-wrap { margin-bottom: 1.25rem; }
      #rest-wrap summary { font-size: .8rem; color: #64748b; cursor: pointer; margin-bottom: .5rem; user-select: none; }
      .rest-endpoint { background: #1e2433; border: 1px solid #2d3748; border-radius: .5rem; margin-bottom: .5rem; overflow: hidden; }
      .rest-head { display: flex; align-items: center; gap: .75rem; padding: .5rem .75rem; cursor: pointer; }
      .rest-head:hover { background: #263044; }
      .rest-method { font-size: .65rem; font-weight: 700; color: #60a5fa; background: #1e3a5e; padding: .15rem .45rem; border-radius: .25rem; }
      .rest-path { font-family: ui-monospace, monospace; font-size: .8rem; color: #e2e8f0; flex: 1; }
      .rest-meta { font-size: .7rem; color: #64748b; }
      .rest-ok  { color: #4ade80; font-size: .75rem; }
      .rest-err { color: #ef4444; font-size: .75rem; }
      .rest-body {
        display: none; padding: .5rem .75rem;
        font-family: ui-monospace, monospace; font-size: .75rem;
        color: #94a3b8; white-space: pre-wrap; word-break: break-all;
        border-top: 1px solid #2d3748; max-height: 18rem; overflow: auto;
        background: #0f1117;
      }
      .rest-body.open { display: block; }
      /* ── raw log ── */
      #log-wrap details { }
      #log-wrap summary { font-size: .8rem; color: #64748b; cursor: pointer; margin-bottom: .5rem; user-select: none; }
      #log {
        background: #0f1117; border: 1px solid #2d3748; border-radius: .375rem;
        color: #94a3b8; font-family: ui-monospace, monospace; font-size: .75rem;
        padding: .75rem; max-height: 14rem; overflow: auto;
      }

      /* ── map ── */
      #map { height: 340px; }
      .leaflet-popup-content-wrapper { background: #1e2433 !important; color: #e2e8f0 !important; border: none; box-shadow: 0 2px 10px rgba(0,0,0,.7) !important; }
      .leaflet-popup-tip { background: #1e2433 !important; }
      .leaflet-popup-close-button { color: #94a3b8 !important; }
      .diff-age-warn { color: #f59e0b; font-size: .65rem; font-weight: 700; margin-left: .3rem; }

      /* ── two-column layout ── */
      #layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        margin-bottom: 1.25rem;
      }
      #left-col  { min-width: 0; }
      #right-col {
        background: #1e2433;
        border: 1px solid #2d3748;
        border-radius: .5rem;
        overflow: hidden;
      }
      @media (min-width: 900px) {
        #layout {
          grid-template-columns: 1fr 1fr;
          align-items: start;
        }
        #right-col {
          position: sticky;
          top: 1.25rem;
        }
        #right-col #map { height: calc(100vh - 30rem); }
      }
      /* marker label — permanent tooltip */
      .leaflet-tooltip.marker-label {
        background: rgba(15,17,23,.88);
        border: 1px solid #2d3748;
        border-radius: .25rem;
        color: #e2e8f0;
        font-size: .65rem;
        font-weight: 600;
        padding: .1rem .35rem;
        white-space: nowrap;
        pointer-events: none;
        box-shadow: none;
      }
      .leaflet-tooltip.marker-label::before { display: none; } /* hide arrow */
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <h1>GNSS SERVER MONITOR</h1>

    <div class="topbar">
      <input id="base-url" value="http://localhost:9200" placeholder="http://host:9200" />
      <button id="go">Connect</button>
      <button class="secondary" id="btn-all" style="display:none">Show all</button>
      <div id="dot"></div>
      <span id="status-text">disconnected</span>
    </div>

    <div id="health-bar" style="display:none">
      <span>Uptime: <b id="h-uptime">—</b></span>
      <span>CRS: <b id="h-crs">—</b></span>
      <span>Antennas: <b id="h-count">—</b></span>
      <span>WS frames: <b id="h-frames">0</b></span>
    </div>

    <!-- two-column layout -->
    <div id="layout">
      <div id="left-col">
        <div id="antenna-grid"></div>
        <div id="detail"></div>

        <div id="rest-wrap">
          <details>
            <summary>REST endpoints</summary>
            <div id="rest-endpoints"></div>
          </details>
        </div>
      </div>

      <div id="right-col">
        <div id="map"></div>
      </div>
    </div>

    <!-- full-width log below -->
    <div id="log-wrap">
      <details>
        <summary>Raw WS log</summary>
        <div id="log"></div>
      </details>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    (() => {
      const $ = id => document.getElementById(id);
      let ws, baseUrl = "", selectedId = null, frames = 0;
      const fixes = {}; // antennaId → latest Fix
      const STALE_MS = 10_000;
      const INACTIVE_MS = 15 * 60 * 1000; // grey out after 15 min of inactivity
      let map = null, mapBoundsFit = false;
      const mapMarkers = {}; // antennaId → { dot, ring }

      // ── connect ──────────────────────────────────────────────────────────
      $("go").onclick = connect;
      $("btn-all").onclick = () => { selectAntenna(null); };

      function connect() {
        baseUrl = $("base-url").value.replace(/\/$/, "");
        const wsUrl = baseUrl.replace(/^http/, "ws") + "/ws";
        if (ws) ws.close();
        setStatus("connecting…", "");
        ws = new WebSocket(wsUrl);
        ws.onopen = () => {
          setStatus("connected", "ok");
          $("btn-all").style.display = "none";
          setInterval(refreshCards, 2_000);
          setInterval(refreshInactiveState, 60_000); // refresh staleness/inactive state once per minute
          initMap();
          initRestPanel();
        };
        ws.onclose = () => setStatus("disconnected", "err");
        ws.onerror = () => setStatus("error", "err");
        ws.onmessage = onMessage;
      }

      function setStatus(txt, cls) {
        $("status-text").textContent = txt;
        $("dot").className = cls;
        if (cls === "ok") $("health-bar").style.display = "";
        if (cls === "err") $("health-bar").style.display = "none";
      }

      // ── health bar (driven by WS data only) ──────────────────────────────
      function updateHealthBar() {
        const ids = Object.keys(fixes);
        if (!ids.length) return;
        $("h-count").textContent = ids.length;
        $("h-crs").textContent = fixes[ids[0]].utm.crs;
      }

      // ── WS messages ───────────────────────────────────────────────────────
      function onMessage(ev) {
        frames++;
        $("h-frames").textContent = frames;
        const msg = JSON.parse(ev.data);
        if (msg.type === "snapshot") {
          for (const f of msg.fixes) { fixes[f.antennaId] = f; updateMap(f); }
          fitMapMarkers();
        } else if (msg.type === "fix") {
          fixes[msg.fix.antennaId] = msg.fix;
          updateMap(msg.fix);
        }
        appendLog(ev.data);
        updateHealthBar();
        renderCards();
        if (selectedId && fixes[selectedId]) renderDetail(fixes[selectedId]);
      }

      // ── antenna cards ─────────────────────────────────────────────────────
      function removeAntenna(id) {
        // remove from data
        delete fixes[id];
        // remove card
        const card = document.getElementById("card-" + CSS.escape(id));
        if (card) card.remove();
        // remove map marker + ring
        if (mapMarkers[id]) {
          mapMarkers[id].dot.remove();
          mapMarkers[id].ring?.remove();
          delete mapMarkers[id];
        }
        // deselect if needed
        if (selectedId === id) {
          selectedId = null;
          $("detail").className = "";
          $("btn-all").style.display = "none";
          if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "unsubscribe" }));
        }
      }

      function purgeStaleAntennas() {
        const now = Date.now();
        for (const [id, f] of Object.entries(fixes)) {
          const age = now - new Date(f.conn.lastByteAt).getTime();
          if (age > INACTIVE_MS * 4) removeAntenna(id); // safety net: drop after 1 h
        }
      }

      // Re-style cards + map markers based on current age (no new fix needed).
      function refreshInactiveState() {
        renderCards();
        for (const f of Object.values(fixes)) updateMap(f);
      }

      function renderCards() {
        const grid = $("antenna-grid");
        const ids = Object.keys(fixes);
        // add/update cards
        for (const id of ids) {
          let card = document.getElementById("card-" + CSS.escape(id));
          if (!card) {
            card = document.createElement("div");
            card.className = "ant-card";
            card.id = "card-" + CSS.escape(id);
            card.onclick = () => selectAntenna(id);
            grid.appendChild(card);
          }
          fillCard(card, fixes[id]);
        }
      }

      function fillCard(card, f) {
        const age = Date.now() - new Date(f.conn.lastByteAt).getTime();
        const stale = age > STALE_MS;
        const inactive = age > INACTIVE_MS;
        card.className = "ant-card"
          + (f.antennaId === selectedId ? " active" : "")
          + (stale && !inactive ? " stale" : "")
          + (inactive ? " inactive" : "");
        const sigH = f.accuracy?.sigmaLat != null
          ? `±${f.accuracy.sigmaLat.toFixed(3)} m N / ±${f.accuracy.sigmaLon.toFixed(3)} m E`
          : "—";
        const src = f.accuracy?.source ?? "";
        const diffWarn = f.fix.diffAge != null && f.fix.diffAge > 5
          ? `<span class="diff-age-warn">⚠ ${f.fix.diffAge.toFixed(0)}s</span>` : "";
        card.innerHTML = `
          <div class="ant-age ${stale ? "stale" : ""}">${fmtAge(age)}</div>
          <div class="ant-name">${esc(f.label ?? f.antennaId)}</div>
          <div class="ant-id">${esc(f.antennaId)} · ${esc(f.conn.remoteIp)}</div>
          <span class="ant-status s-${f.fix.status}">${f.fix.status}</span>${diffWarn}
          <div class="ant-row"><span>Lat</span><b>${f.llh.lat.toFixed(7)}°</b></div>
          <div class="ant-row"><span>Lon</span><b>${f.llh.lon.toFixed(7)}°</b></div>
          <div class="ant-row"><span>Alt (MSL)</span><b>${f.llh.altMsl.toFixed(3)} m</b></div>
          <div class="ant-row"><span>Sats / HDOP</span><b>${f.fix.satellites} / ${f.fix.hdop}</b></div>
          <div class="ant-row"><span>Accuracy (${src})</span><b style="font-size:.7rem">${sigH}</b></div>`;
      }

      function refreshCards() {
        for (const id of Object.keys(fixes)) {
          const card = document.getElementById("card-" + CSS.escape(id));
          if (card) fillCard(card, fixes[id]);
        }
        if (selectedId && fixes[selectedId]) renderDetail(fixes[selectedId]);
      }

      // ── selection ─────────────────────────────────────────────────────────
      function selectAntenna(id) {
        selectedId = id;
        if (id) {
          ws.send(JSON.stringify({ type: "subscribe", ids: [id] }));
          $("btn-all").style.display = "";
          renderDetail(fixes[id]);
          $("detail").className = "visible";
        } else {
          ws.send(JSON.stringify({ type: "unsubscribe" }));
          $("btn-all").style.display = "none";
          $("detail").className = "";
        }
        highlightMapMarker(id);
        renderCards();
      }

      // ── detail pane ───────────────────────────────────────────────────────
      function renderDetail(f) {
        const el = $("detail");
        const ll = f.llh, xy = f.utm, xyz = f.xyz, acc = f.accuracy ?? {}, fix = f.fix;
        const vdop = fix.vdop != null ? fix.vdop.toFixed(2) : "—";
        const pdop = fix.pdop != null ? fix.pdop.toFixed(2) : "—";
        const vel = f.velocity
          ? `${f.velocity.speedKmh.toFixed(1)} km/h · ${f.velocity.courseTrue.toFixed(1)}°`
          : "—";
        const sigXYZ = xyz.sigmaX != null
          ? `σX ${xyz.sigmaX.toFixed(4)} m / σY ${xyz.sigmaY.toFixed(4)} m / σZ ${xyz.sigmaZ.toFixed(4)} m`
          : "—";
        const sigUTM = xy.sigmaE != null
          ? `σE ${xy.sigmaE.toFixed(4)} m / σN ${xy.sigmaN.toFixed(4)} m`
          : "—";
        const diffAgeHtml = fix.diffAge != null
          ? `<span style="${fix.diffAge > 5 ? "color:#f59e0b" : "color:#4ade80"}">${fix.diffAge.toFixed(1)} s ago</span>`
          : `<span style="color:#6b7280">N/A</span>`;
        const refIdHtml = fix.refStationId ? `Base: ${esc(fix.refStationId)}` : "—";

        el.innerHTML = `
          <h2>${esc(f.label ?? f.antennaId)} — detail</h2>
          <div class="detail-grid">
            <div class="detail-box">
              <div class="lbl">Position (WGS84)</div>
              <div class="val mono">${ll.lat.toFixed(8)}°<br>${ll.lon.toFixed(8)}°</div>
              <div class="sub">Alt MSL ${ll.altMsl.toFixed(3)} m · Geoid sep ${ll.geoidSep.toFixed(3)} m · Ell ${ll.altEll.toFixed(3)} m</div>
            </div>
            <div class="detail-box">
              <div class="lbl">UTM (${esc(xy.crs)})</div>
              <div class="val mono">E ${xy.x.toFixed(3)}<br>N ${xy.y.toFixed(3)}</div>
              <div class="sub">${sigUTM}</div>
            </div>
            <div class="detail-box">
              <div class="lbl">ECEF (XYZ)</div>
              <div class="val mono">${xyz.x.toFixed(3)}<br>${xyz.y.toFixed(3)}<br>${xyz.z.toFixed(3)}</div>
              <div class="sub">${sigXYZ}</div>
            </div>
            <div class="detail-box">
              <div class="lbl">Accuracy (${esc(acc.source ?? "—")})</div>
              <div class="val">
                ${acc.sigmaLat != null ? `σN ${acc.sigmaLat.toFixed(4)} m` : "—"}<br>
                ${acc.sigmaLon != null ? `σE ${acc.sigmaLon.toFixed(4)} m` : "—"}<br>
                ${acc.sigmaAlt != null ? `σU ${acc.sigmaAlt.toFixed(4)} m` : "—"}
              </div>
            </div>
            <div class="detail-box">
              <div class="lbl">Fix quality</div>
              <div class="val"><span class="ant-status s-${fix.status}">${fix.status}</span></div>
              <div class="sub">Quality ${fix.quality} · Sats ${fix.satellites} · HDOP ${fix.hdop} · VDOP ${vdop} · PDOP ${pdop}</div>
            </div>
            <div class="detail-box">
              <div class="lbl">Corrections (diff age)</div>
              <div class="val">${diffAgeHtml}</div>
              <div class="sub">${refIdHtml}</div>
            </div>
            <div class="detail-box">
              <div class="lbl">Velocity</div>
              <div class="val">${vel}</div>
              ${f.velocity ? `<div class="sub">${f.velocity.speedKnots.toFixed(2)} kn</div>` : ""}
            </div>
            <div class="detail-box">
              <div class="lbl">UTC time</div>
              <div class="val mono">${esc(f.utcDate ?? "—")} ${esc(f.utc)}</div>
              <div class="sub">Received ${esc(f.receivedAt)}</div>
            </div>
            <div class="detail-box">
              <div class="lbl">Connection</div>
              <div class="val mono">${esc(f.conn.remoteIp)}:${f.conn.remotePort}</div>
              <div class="sub">Since ${esc(f.conn.since)}</div>
            </div>
          </div>`;
      }

      // ── REST panel ──────────────────────────────────────────────────────────────────────────
      const REST_ENDPOINTS = [
        { path: "/api/health",   label: "Health" },
        { path: "/api/antennas", label: "Antennas" },
        { path: "/api/fixes",    label: "Fixes (snapshot)" },
      ];
      const restState = {}; // path → { el, bodyEl, lastMs, ok }

      function initRestPanel() {
        const container = $("rest-endpoints");
        container.innerHTML = "";
        for (const ep of REST_ENDPOINTS) {
          const wrap = document.createElement("div");
          wrap.className = "rest-endpoint";
          const head = document.createElement("div");
          head.className = "rest-head";
          head.innerHTML = `<span class="rest-method">GET</span>
            <span class="rest-path">${esc(ep.path)}</span>
            <span class="rest-meta" id="rm-${esc(ep.path)}">not fetched</span>
            <button class="secondary" style="font-size:.7rem;padding:.2rem .5rem">Refresh</button>`;
          const body = document.createElement("pre");
          body.className = "rest-body";
          body.id = "rb-" + esc(ep.path);
          head.querySelector("button").onclick = (e) => { e.stopPropagation(); fetchEndpoint(ep.path); };
          head.onclick = () => body.classList.toggle("open");
          wrap.appendChild(head);
          wrap.appendChild(body);
          container.appendChild(wrap);
        }
        refreshRestPanel();
      }

      async function fetchEndpoint(path) {
        const metaEl = $("rm-" + path);
        const bodyEl = $("rb-" + path);
        const t0 = Date.now();
        try {
          const res = await fetch(baseUrl + path);
          const ms = Date.now() - t0;
          const text = await res.text();
          // pretty-print if JSON
          let pretty = text;
          try {
            const parsed = JSON.parse(text);
            pretty = JSON.stringify(parsed, null, 2);
            // Populate uptime in the health bar when /api/health is fetched.
            if (path === "/api/health" && parsed.uptime != null) {
              $("h-uptime").textContent = fmtUptime(parsed.uptime);
            }
          } catch {}
          bodyEl.textContent = pretty;
          metaEl.innerHTML = `<span class="rest-ok">${res.status} OK</span> <span style="color:#64748b">${ms}ms · ${new Date().toLocaleTimeString()}</span>`;
        } catch (err) {
          const ms = Date.now() - t0;
          bodyEl.textContent = String(err);
          metaEl.innerHTML = `<span class="rest-err">error</span> <span style="color:#64748b">${ms}ms · ${new Date().toLocaleTimeString()}</span>`;
        }
      }

      function refreshRestPanel() {
        // Called only on explicit user action (Refresh button or panel open).
        for (const ep of REST_ENDPOINTS) {
          const bodyEl = $("rb-" + ep.path);
          if (bodyEl && bodyEl.classList.contains("open")) fetchEndpoint(ep.path);
        }
      }

      // ── raw log ──────────────────────────────────────────────────────────────────────────
      function appendLog(txt) {
        const el = $("log");
        el.textContent = txt.slice(0, 400) + (txt.length > 400 ? "…" : "") + "\n" + el.textContent;
        if (el.textContent.length > 12_000) el.textContent = el.textContent.slice(0, 12_000);
      }

      // ── helpers ───────────────────────────────────────────────────────────
      function fmtAge(ms) {
        if (ms < 2000) return `${ms}ms`;
        if (ms < 60_000) return `${(ms/1000).toFixed(0)}s ago`;
        return `${(ms/60_000).toFixed(0)}m ago`;
      }
      function fmtUptime(s) {
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = Math.floor(s % 60);
        return h ? `${h}h ${m}m` : m ? `${m}m ${ss}s` : `${ss}s`;
      }
      function esc(s) {
        return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }

      // ── map ──────────────────────────────────────────────────────────────
      const STATUS_COLORS = {
        RTK_FIXED: "#4ade80", RTK_FLOAT: "#60a5fa", DGPS: "#86efac",
        GPS: "#fde047", ESTIMATED: "#fb923c",
      };

      function initMap() {
        if (map) return;
        map = L.map("map");
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          maxZoom: 22,
        }).addTo(map);
      }

      function fitMapMarkers() {
        if (!map || mapBoundsFit) return;
        const lls = Object.values(mapMarkers).map(m => m.dot.getLatLng());
        if (lls.length === 1) { map.setView(lls[0], 18); mapBoundsFit = true; }
        else if (lls.length > 1) { map.fitBounds(L.latLngBounds(lls).pad(0.3)); mapBoundsFit = true; }
      }

      function updateMap(f) {
        if (!map) return;
        const lat = f.llh.lat, lon = f.llh.lon;
        const age = Date.now() - new Date(f.conn.lastByteAt).getTime();
        const inactive = age > INACTIVE_MS;
        const color = inactive ? "#6b7280" : (STATUS_COLORS[f.fix.status] ?? "#6b7280");
        const fillOpacity = inactive ? 0.35 : 0.85;
        const strokeOpacity = inactive ? 0.6 : 1;
        const isSelected = f.antennaId === selectedId;
        const labelText = f.label ?? f.antennaId;
        const popup = `<b>${esc(labelText)}</b><br>` +
          `<span style="font-size:.8rem">${f.fix.status}${inactive ? " (inactive)" : ""}</span><br>` +
          `<span style="font-size:.75rem;font-family:monospace">${lat.toFixed(7)}°, ${lon.toFixed(7)}°</span>`;
        const dotOpts = { radius: isSelected ? 10 : 7, color, fillColor: color, fillOpacity, opacity: strokeOpacity, weight: isSelected ? 3 : 2 };

        if (mapMarkers[f.antennaId]) {
          const m = mapMarkers[f.antennaId];
          m.dot.setLatLng([lat, lon]);
          m.dot.setRadius(isSelected ? 10 : 7);
          m.dot.setStyle({ color, fillColor: color, fillOpacity, opacity: strokeOpacity, weight: isSelected ? 3 : 2 });
          m.dot.getPopup()?.setContent(popup);
          // tooltip follows the circleMarker automatically
          const sigR = f.accuracy?.sigmaLat;
          if (m.ring) {
            if (inactive) {
              // hide stale accuracy ring — its uncertainty estimate is no longer trustworthy
              m.ring.remove();
              m.ring = null;
            } else if (sigR != null) {
              m.ring.setLatLng([lat, lon]).setRadius(Math.max(sigR, 0.02)).setStyle({ color });
            }
          } else if (!inactive && sigR != null) {
            m.ring = L.circle([lat, lon], { radius: Math.max(sigR, 0.02), color, fillColor: color, fillOpacity: 0.12, weight: 1, dashArray: "4 4" }).addTo(map);
          }
        } else {
          const dot = L.circleMarker([lat, lon], dotOpts).addTo(map).bindPopup(popup);
          dot.bindTooltip(labelText, { permanent: true, direction: 'right', className: 'marker-label', offset: [8, 0] });
          dot.on("click", () => selectAntenna(f.antennaId));
          const sigR = f.accuracy?.sigmaLat;
          const ring = (!inactive && sigR != null)
            ? L.circle([lat, lon], { radius: Math.max(sigR, 0.02), color, fillColor: color, fillOpacity: 0.12, weight: 1, dashArray: "4 4" }).addTo(map)
            : null;
          mapMarkers[f.antennaId] = { dot, ring };
        }
      }

      function highlightMapMarker(id) {
        for (const [aid, m] of Object.entries(mapMarkers)) {
          const sel = aid === id;
          m.dot.setRadius(sel ? 10 : 7);
          m.dot.setStyle({ weight: sel ? 3 : 2 });
        }
        if (id && mapMarkers[id]) map?.panTo(mapMarkers[id].dot.getLatLng());
      }

    })();
    </script>
  </body>
</html>
