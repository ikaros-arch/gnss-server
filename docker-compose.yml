name: gnss-server

services:
  gnss-server:
    container_name: gnss-server
    build:
      context: .
      dockerfile: Dockerfile
    image: gnss-server:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TCP_PORT: "9100"
      HTTP_PORT: "9200"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OUTPUT_CRS: ${OUTPUT_CRS:-EPSG:32635}
      ANTENNAS_FILE: /app/config/antennas.json
    ports:
      - "${GNSS_TCP_PORT:-9100}:9100"
      - "${GNSS_HTTP_PORT:-9200}:9200"
    volumes:
      - ./config:/app/config:ro
