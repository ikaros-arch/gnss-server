; XIAO ESP32-S3 GNSS USB bridge
;
; The XIAO is a USB *device* here: the receiver hosts it and powers it, and NMEA
; arrives on the XIAO's USB CDC port. Set the receiver to stream to its hosted USB
; serial device (on a Reach RS3: Emlid Flow -> Position streaming -> Serial ->
; "USB OTG", NMEA, 38400 — the baud is nominal over CDC and is ignored here).
;
; The bridge re-emits every sentence on:
;   * BLE Nordic UART Service  -> what the Ikaros app's bleSource already reads
;   * a Wi-Fi TCP server       -> the app's other transport, and how the bench reads it
;
; Build/upload with the venv's PlatformIO (see ../README.md):
;   ../.venv/bin/pio run -t upload
; The XIAO has one USB port, so unplug it from the receiver to flash, and watch logs
; on UART0 (D6/D7 = GPIO43/44) with a USB-TTL adapter.

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = the USB CDC port the receiver writes to
    -DARDUINO_USB_MODE=1          ; hardware USB-Serial-JTAG; enumerates as 303a:1001 CDC-ACM
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
