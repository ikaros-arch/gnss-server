# Production overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds: resource limits, JSON file log rotation, explicit restart policy.
# All other settings (ports, volumes, env) are inherited from docker-compose.yml.

name: gnss-server

services:
  gnss-server:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
